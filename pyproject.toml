[project]
# tomllib is 3.11+, and two scheduled jobs on this machine still invoke 3.9.
requires-python = ">=3.11"

[tool.ruff]
# Vendored copy of the shared strict defaults: a home path does not resolve on
# a CI runner. The weekly audit reports it if this copy drifts from the source.
extend = "ruff-shared.toml"
